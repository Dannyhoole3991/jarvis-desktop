<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Jarvis</title>
<style>
  :root{
    --gold: #ffb347;
    --amber: #ff8c3d;
    --gold-bright: #ffe0a3;
    --text: #fff3e0;
    --text-dim: rgba(255, 230, 200, 0.55);
    --text-dimmer: rgba(255, 230, 200, 0.32);
    --green: #35e08a;
    --red: #ff6a6a;
    --panel-border: rgba(255, 179, 71, 0.16);
  }
  html, body {
    margin:0; padding:0; width:100%; height:100%;
    background:#000;
    color: var(--text);
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
    overflow:hidden;
    -webkit-user-select:none; user-select:none;
  }
  input { user-select:text; }

  .drag-region {
    position:absolute; top:0; left:0; right:0; height:36px;
    -webkit-app-region: drag;
  }
  /* A wider invisible zone in the top-right corner triggers the reveal,
     so the buttons don't have to be hovered pixel-perfectly to appear. */
  .titlebar-hover-zone {
    position:absolute; top:0; right:0; width:170px; height:50px; z-index:10;
  }
  .titlebar-btns {
    position:absolute; top:8px; right:10px; display:flex; gap:8px;
    opacity:0; pointer-events:none;
    transition: opacity 0.15s ease;
  }
  .titlebar-hover-zone:hover .titlebar-btns {
    opacity:1; pointer-events:auto;
  }
  .titlebar-btns button {
    width:26px; height:26px; border-radius:50%; border:1px solid var(--panel-border);
    background: rgba(255,179,71,0.08); color: var(--text-dim); cursor:pointer; font-size:12px;
  }
  .titlebar-btns button:hover { background: rgba(255,179,71,0.18); color:var(--text); }
  .titlebar-btns button.quit:hover { background: rgba(255,106,106,0.22); color:var(--red); }

  .pc-status {
    position:absolute; top:12px; left:16px;
    font-size:11px; color: var(--text-dim); display:flex; align-items:center; gap:6px; z-index:10;
  }
  .pc-status .dot { width:7px; height:7px; border-radius:50%; background: rgba(255,255,255,0.25); }
  .pc-status.online .dot { background: var(--green); box-shadow: 0 0 5px var(--green); }

  .wrap {
    width:100%; height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:22px;
    padding: 0 20px; box-sizing:border-box;
  }

  #orbCanvas { display:block; }

  .status-text {
    font-size:13px; letter-spacing:0.5px; color: var(--text-dim);
    min-height:18px; text-align:center;
  }

  .input-row {
    width:100%; max-width:420px;
    display:flex; align-items:center; gap:8px;
    background: rgba(255,255,255,0.05);
    border:1px solid var(--panel-border);
    border-radius:24px;
    padding: 6px 6px 6px 18px;
  }
  .input-row input {
    flex:1; background:transparent; border:none; outline:none;
    color: var(--text); font-size:15px; padding:10px 4px; min-width:0;
  }
  .input-row input::placeholder { color: rgba(255,230,200,0.35); }
  .round-btn {
    width:38px; height:38px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background: rgba(255,179,71,0.14); border:1px solid var(--panel-border);
    color: var(--gold); cursor:pointer; font-size:15px;
  }
  .round-btn.stop {
    background: rgba(255,106,106,0.14); border-color: rgba(255,106,106,0.3); color: var(--red);
  }
  .control-row { display:flex; gap:14px; align-items:center; }

  /* Slim, secondary system readout -- present, but never competing with
     the orb for attention the way the old full dashboard did. */
  .sys-strip {
    position:absolute; bottom:14px; left:0; right:0;
    display:flex; justify-content:center; gap:22px;
    font-size:11px; color: var(--text-dimmer); letter-spacing:0.3px;
  }
  .sys-strip span b { color: var(--text-dim); font-weight:600; }

  .activity-panel {
    position:absolute; top:12px; right:56px; width:260px;
    font-size:11px; color: var(--text-dimmer); text-align:right;
    max-height:70px; overflow:hidden; line-height:1.5;
  }
  .activity-panel .current { color: var(--gold); }

  .orb-area {
    display:flex; flex-direction:column; align-items:center; gap:22px;
  }

  /* Window mode: a full chat log with history and pictures, in place of
     the minimal orb -- toggled by #modeToggleBtn. Both views share the
     same input row/state underneath, so switching back and forth never
     loses anything; it's a pure CSS visibility swap, nothing is torn
     down or reset. */
  .chat-log {
    display:none;
    width:100%; max-width:640px; flex:1; min-height:0;
    overflow-y:auto;
    border:1px solid var(--panel-border);
    border-radius:14px;
    padding:14px;
    box-sizing:border-box;
    background: rgba(255,255,255,0.03);
  }
  body.window-mode .orb-area { display:none; }
  body.window-mode .chat-log { display:block; }
  body.window-mode .wrap { padding-top:56px; }
  body.window-mode .input-row { max-width:640px; }

  .chat-msg { margin-bottom:14px; max-width:85%; }
  .chat-msg.chat-user { margin-left:auto; text-align:right; }
  .chat-msg.chat-jarvis { margin-right:auto; text-align:left; }
  .chat-text {
    display:inline-block; padding:8px 14px; border-radius:14px;
    font-size:14px; line-height:1.4; white-space:pre-wrap; text-align:left;
  }
  .chat-user .chat-text { background: rgba(255,179,71,0.16); color: var(--gold-bright); }
  .chat-jarvis .chat-text { background: rgba(255,255,255,0.06); color: var(--text); }
  .chat-image {
    display:block; max-width:260px; border-radius:10px; margin-top:6px;
    border:1px solid var(--panel-border);
  }
  .chat-user .chat-image { margin-left:auto; }
</style>
</head>
<body>

<div class="drag-region"></div>
<div class="titlebar-hover-zone">
  <div class="titlebar-btns">
    <button id="hideBtn" title="Hide to tray">&#9472;</button>
    <button id="maxBtn" title="Maximize">&#9723;</button>
    <button id="quitBtn" class="quit" title="Quit">&#10005;</button>
  </div>
</div>

<div class="pc-status" id="pcStatus"><span class="dot"></span><span id="pcStatusText">Connecting...</span></div>
<div class="activity-panel" id="activityPanel"></div>

<div class="wrap">
  <div class="orb-area" id="orbArea">
    <canvas id="orbCanvas" width="360" height="360"></canvas>
    <div class="status-text" id="statusText">Standing by</div>
  </div>

  <div class="chat-log" id="chatLog"></div>

  <div class="input-row">
    <input id="textInput" type="text" placeholder="Tell Jarvis..." />
    <div class="round-btn" id="attachBtn" title="Attach a picture">&#128206;</div>
    <div class="round-btn" id="sendBtn" title="Send">&#10148;</div>
  </div>
  <div class="control-row">
    <div class="round-btn stop" id="stopBtn" title="Stop">&#9632;</div>
    <div class="round-btn" id="modeToggleBtn" title="Switch to window view">&#9635;</div>
  </div>
</div>
<input type="file" id="fileInput" accept="image/*" hidden />

<div class="sys-strip" id="sysStrip"></div>

<script>
// ============================================================
// The orb: a rotating holographic wireframe globe (meridians,
// parallels, and scattered "data light" points), drawn on canvas so
// it's genuinely animating, not a static image -- Danny's reference
// was Tony Stark's globe hologram. Warm gold/amber on purpose: blue
// read as "too Ultron."
// ============================================================
const canvas = document.getElementById("orbCanvas");
const ctx = canvas.getContext("2d");
const SIZE = 360;

// Three nested spheres, same shape/style, alternating spin direction --
// outer clockwise, middle anticlockwise, inner clockwise again. Danny's
// call after testing the single- and double-orb versions live.
const R1 = 128;
const R2 = R1 * 0.70;
const R3 = R1 * 0.40;

let rotY1 = 0, rotX1 = 0.15;
let rotY2 = 0, rotX2 = 0.15;
let rotY3 = 0, rotX3 = 0.15;
let orbState = "idle"; // idle | thinking | speaking

function project(x, y, z) {
  // Simple orthographic-ish projection with a touch of perspective.
  const scale = 300 / (300 - z);
  return { x: SIZE / 2 + x * scale, y: SIZE / 2 + y * scale, scale };
}

function rotateWith(p, rY, rX) {
  // Rotate around Y then X.
  let { x, y, z } = p;
  let cosY = Math.cos(rY), sinY = Math.sin(rY);
  let x1 = x * cosY - z * sinY;
  let z1 = x * sinY + z * cosY;
  let cosX = Math.cos(rX), sinX = Math.sin(rX);
  let y1 = y * cosX - z1 * sinX;
  let z2 = y * sinX + z1 * cosX;
  return { x: x1, y: y1, z: z2 };
}
function rotatePoint1(p) { return rotateWith(p, rotY1, rotX1); }
function rotatePoint2(p) { return rotateWith(p, rotY2, rotX2); }
function rotatePoint3(p) { return rotateWith(p, rotY3, rotX3); }

// Danny's note: it doesn't need to be a perfect sphere -- the
// reference is lumpy/irregular, not a uniform globe. This distorts
// radius as a function of direction (several overlapping sine waves,
// a cheap stand-in for real 3D noise) so it bulges and dents
// organically. Applied everywhere a point is placed, so the grid,
// arcs, and lights all deform together instead of looking like
// mismatched layers. Shared by all three spheres (just a different
// base radius) so each one reads as the same shape, scaled down.
function bulge(ux, uy, uz, radius) {
  const n = Math.sin(ux * 3.4 + uy * 2.1) * 0.5
          + Math.sin(uy * 2.6 - uz * 3.7 + 1.3) * 0.35
          + Math.sin(uz * 4.8 + ux * 1.6 - 0.7) * 0.3
          + Math.sin((ux + uy + uz) * 5.5) * 0.18;
  return radius * (1 + n * 0.16);
}

// Meridians (longitude lines) and parallels (latitude lines), each as
// an array of 3D points around the (bulged, not perfect) sphere.
function buildGrid(radius, meridianCount, parallelCount, segs) {
  const lines = [];
  for (let m = 0; m < meridianCount; m++) {
    const lon = (m / meridianCount) * Math.PI * 2 + (Math.random() - 0.5) * 0.06;
    const pts = [];
    for (let s = 0; s <= segs; s++) {
      const lat = (s / segs) * Math.PI - Math.PI / 2;
      const ux = Math.cos(lat) * Math.cos(lon), uy = Math.sin(lat), uz = Math.cos(lat) * Math.sin(lon);
      const rad = bulge(ux, uy, uz, radius);
      pts.push({ x: rad * ux, y: rad * uy, z: rad * uz });
    }
    lines.push(pts);
  }
  for (let p = 1; p < parallelCount; p++) {
    const lat = (p / parallelCount) * Math.PI - Math.PI / 2 + (Math.random() - 0.5) * 0.03;
    const pts = [];
    for (let s = 0; s <= segs; s++) {
      const lon = (s / segs) * Math.PI * 2;
      const ux = Math.cos(lat) * Math.cos(lon), uy = Math.sin(lat), uz = Math.cos(lat) * Math.sin(lon);
      const rad = bulge(ux, uy, uz, radius);
      pts.push({ x: rad * ux, y: rad * uy, z: rad * uz });
    }
    lines.push(pts);
  }
  return lines;
}

// Scattered "city light" data points -- Fibonacci sphere distribution
// for even base coverage, then bulged and jittered off-surface a
// little for the messier, less-uniform cluster look in the reference.
function buildLights(count, radius) {
  const pts = [];
  const golden = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < count; i++) {
    const yFrac = 1 - (i / (count - 1)) * 2;
    const radiusAtY = Math.sqrt(1 - yFrac * yFrac);
    const theta = golden * i;
    const ux = Math.cos(theta) * radiusAtY, uy = yFrac, uz = Math.sin(theta) * radiusAtY;
    const rad = bulge(ux, uy, uz, radius) * (0.94 + Math.random() * 0.12);
    pts.push({ x: rad * ux, y: rad * uy, z: rad * uz, twinkle: Math.random() * Math.PI * 2 });
  }
  return pts;
}

// Chaotic long arcs crossing the sphere at random angles, for the
// tangled-thread texture in the reference beyond a plain grid globe --
// also bulged per-point rather than sitting on a perfect sphere.
function buildChaosArcs(count, segs, radius) {
  segs = segs || 40;
  const arcs = [];
  for (let i = 0; i < count; i++) {
    const a1 = Math.random() * Math.PI * 2, a2 = Math.random() * Math.PI - Math.PI / 2;
    const b1 = Math.random() * Math.PI * 2, b2 = Math.random() * Math.PI - Math.PI / 2;
    const start = { x: Math.cos(a2) * Math.cos(a1), y: Math.sin(a2), z: Math.cos(a2) * Math.sin(a1) };
    const end = { x: Math.cos(b2) * Math.cos(b1), y: Math.sin(b2), z: Math.cos(b2) * Math.sin(b1) };
    const pts = [];
    for (let s = 0; s <= segs; s++) {
      const t = s / segs;
      // Slerp-ish interpolation then renormalize to a unit direction.
      let x = start.x + (end.x - start.x) * t;
      let y = start.y + (end.y - start.y) * t;
      let z = start.z + (end.z - start.z) * t;
      const len = Math.sqrt(x * x + y * y + z * z) || 1;
      const ux = x / len, uy = y / len, uz = z / len;
      const rad = bulge(ux, uy, uz, radius);
      pts.push({ x: rad * ux, y: rad * uy, z: rad * uz });
    }
    arcs.push(pts);
  }
  return arcs;
}

// Lines from the glowing core out to the shell -- the reference's
// most distinctive feature, which the surface-only grid/arcs above
// don't produce on their own. Always reaches the OUTERMOST shell (R1),
// rotating with it -- with the other two spheres nested inside that
// same radius, they read as energy connecting all three.
function buildSpokes(count) {
  const spokes = [];
  const golden = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < count; i++) {
    const yFrac = 1 - (i / (count - 1)) * 2;
    const radiusAtY = Math.sqrt(1 - yFrac * yFrac);
    const theta = golden * i + (Math.random() - 0.5) * 0.4;
    const ux = Math.cos(theta) * radiusAtY, uy = yFrac, uz = Math.sin(theta) * radiusAtY;
    const rad = bulge(ux, uy, uz, R1) * (0.9 + Math.random() * 0.2);

    // Two axes perpendicular to the spoke's main direction, so it can
    // wobble sideways rather than being a perfectly straight ray.
    let px = -uz, py = 0, pz = ux;
    const plen = Math.sqrt(px * px + py * py + pz * pz) || 1;
    px /= plen; py /= plen; pz /= plen;
    const qx = uy * pz - uz * py, qy = uz * px - ux * pz, qz = ux * py - uy * px;

    const wobbleAmp = R1 * (0.05 + Math.random() * 0.14);
    const freq = 1 + Math.random() * 2.5;
    const phase1 = Math.random() * Math.PI * 2;
    const phase2 = Math.random() * Math.PI * 2;

    const segs = 18;
    const pts = [];
    for (let s = 0; s <= segs; s++) {
      const t = s / segs;
      // Zero wobble right at the core, growing toward the shell --
      // random per spoke so they don't all curve the same way.
      const w1 = Math.sin(t * Math.PI * freq + phase1) * wobbleAmp * t;
      const w2 = Math.cos(t * Math.PI * freq + phase2) * wobbleAmp * t * 0.7;
      pts.push({
        x: rad * ux * t + px * w1 + qx * w2,
        y: rad * uy * t + py * w1 + qy * w2,
        z: rad * uz * t + pz * w1 + qz * w2,
      });
    }
    spokes.push(pts);
  }
  return spokes;
}

const gridLines1 = buildGrid(R1, 26, 15, 64);
const lights1 = buildLights(320, R1);
const chaosArcs1 = buildChaosArcs(85, 60, R1);
const spokes = buildSpokes(70);

const gridLines2 = buildGrid(R2, 22, 12, 54);
const lights2 = buildLights(240, R2);
const chaosArcs2 = buildChaosArcs(65, 50, R2);

const gridLines3 = buildGrid(R3, 16, 9, 38);
const lights3 = buildLights(140, R3);
const chaosArcs3 = buildChaosArcs(35, 28, R3);

function colorForState() {
  if (orbState === "thinking") return { line: "255,163,71", light: "255,224,163", glow: 22 };
  if (orbState === "speaking") return { line: "255,140,61", light: "255,200,140", glow: 26 };
  return { line: "255,179,71", light: "255,224,163", glow: 14 };
}

function drawLine(pts, color, baseAlpha, radius, rotateFn) {
  ctx.beginPath();
  let started = false;
  for (const raw of pts) {
    const r = rotateFn(raw);
    if (r.z < -radius * 0.85) { started = false; continue; } // hide far-side clutter a touch
    const proj = project(r.x, r.y, r.z);
    if (!started) {
      ctx.moveTo(proj.x, proj.y);
      started = true;
    } else {
      ctx.lineTo(proj.x, proj.y);
    }
  }
  ctx.strokeStyle = `rgba(${color},${baseAlpha})`;
  ctx.lineWidth = 0.7;
  ctx.stroke();
}

function drawSpoke(pts, color) {
  // Bright at the core, fading out toward the shell -- a gradient
  // along screen-space endpoints rather than a flat alpha, so it
  // actually reads as energy radiating outward. Tied to the outer
  // sphere's rotation, same as buildSpokes targeting R1.
  const r0 = rotatePoint1(pts[0]);
  const first = project(r0.x, r0.y, r0.z);
  const r1 = rotatePoint1(pts[pts.length - 1]);
  const lastProj = project(r1.x, r1.y, r1.z);
  const grad = ctx.createLinearGradient(first.x, first.y, lastProj.x, lastProj.y);
  grad.addColorStop(0, `rgba(${color},0.55)`);
  grad.addColorStop(1, `rgba(${color},0.02)`);
  ctx.beginPath();
  ctx.moveTo(first.x, first.y);
  ctx.lineTo(lastProj.x, lastProj.y);
  ctx.strokeStyle = grad;
  ctx.lineWidth = 0.8;
  ctx.stroke();
}

function drawLights(lightSet, radius, rotateFn, lightColor) {
  const now = performance.now() / 500;
  for (const p of lightSet) {
    const r = rotateFn(p);
    if (r.z < -radius * 0.4) continue;
    const proj = project(r.x, r.y, r.z);
    const twinkle = 0.5 + 0.5 * Math.sin(now + p.twinkle);
    const depthAlpha = Math.max(0.15, (r.z + radius) / (2 * radius));
    const radiusPx = 0.6 + 1.1 * depthAlpha * twinkle;
    ctx.beginPath();
    ctx.arc(proj.x, proj.y, radiusPx, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${lightColor},${(0.35 + 0.5 * twinkle) * depthAlpha})`;
    ctx.shadowColor = `rgba(${lightColor},0.9)`;
    ctx.shadowBlur = 6;
    ctx.fill();
  }
}

function draw() {
  ctx.clearRect(0, 0, SIZE, SIZE);
  const c = colorForState();

  ctx.save();
  ctx.shadowColor = `rgba(${c.line},0.9)`;
  ctx.shadowBlur = c.glow * 0.4;
  for (const line of gridLines1) drawLine(line, c.line, 0.13, R1, rotatePoint1);
  for (const arc of chaosArcs1) drawLine(arc, c.line, 0.05, R1, rotatePoint1);
  for (const spoke of spokes) drawSpoke(spoke, c.line);
  for (const line of gridLines2) drawLine(line, c.line, 0.15, R2, rotatePoint2);
  for (const arc of chaosArcs2) drawLine(arc, c.line, 0.06, R2, rotatePoint2);
  for (const line of gridLines3) drawLine(line, c.line, 0.18, R3, rotatePoint3);
  for (const arc of chaosArcs3) drawLine(arc, c.line, 0.08, R3, rotatePoint3);
  ctx.restore();

  // Bright core glow behind everything at center.
  const core = ctx.createRadialGradient(SIZE / 2, SIZE / 2, 3, SIZE / 2, SIZE / 2, R3 * 0.6);
  core.addColorStop(0, `rgba(${c.light},0.35)`);
  core.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = core;
  ctx.fillRect(0, 0, SIZE, SIZE);

  // Data-light points on top, twinkling -- outer sphere through inner.
  drawLights(lights1, R1, rotatePoint1, c.light);
  drawLights(lights2, R2, rotatePoint2, c.light);
  drawLights(lights3, R3, rotatePoint3, c.light);

  const speed = orbState === "thinking" ? 0.014 : orbState === "speaking" ? 0.009 : 0.004;

  // Outer: clockwise. Middle: anticlockwise. Inner: clockwise again.
  rotY1 += speed;
  rotX1 = 0.15 + Math.sin(performance.now() / 4000) * 0.05;

  rotY2 -= speed * 1.1;
  rotX2 = 0.15 + Math.cos(performance.now() / 3600) * 0.055;

  rotY3 += speed * 1.35;
  rotX3 = 0.15 + Math.sin(performance.now() / 3000) * 0.06;

  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

function setOrbState(state) {
  orbState = state;
  const labels = { thinking: "Thinking...", speaking: "Speaking...", idle: "Standing by" };
  document.getElementById("statusText").textContent = labels[state] || "Standing by";
}

// ============================================================
// Window chrome (talks to the Python side via pywebview's js_api,
// exactly as Jarvis_Desktop_HUD.py already exposes it)
// ============================================================
document.getElementById("hideBtn").addEventListener("click", () => {
  window.pywebview && window.pywebview.api.hide_to_tray();
});
document.getElementById("maxBtn").addEventListener("click", () => {
  window.pywebview && window.pywebview.api.toggle_maximize();
});
document.getElementById("quitBtn").addEventListener("click", () => {
  window.pywebview && window.pywebview.api.quit_app();
});

// ============================================================
// Talking to the real engine over the same local HTTP interface the
// phone app already uses (http://localhost:8765).
// ============================================================
const BASE = "http://localhost:8765";

// The engine's /command, /stop, and /attach_image all require this once
// JARVIS_PHONE_SECRET is configured (added for the phone's public tunnel)
// -- fetched from the Python side since a static HTML file has no other
// way to read an environment variable. Retried briefly because
// window.pywebview.api isn't guaranteed to exist the instant this script
// runs.
let sharedSecret = "";
function initSharedSecret(attempt) {
  attempt = attempt || 0;
  if (window.pywebview && window.pywebview.api && window.pywebview.api.get_shared_secret) {
    window.pywebview.api.get_shared_secret().then(s => { sharedSecret = s || ""; });
  } else if (attempt < 20) {
    setTimeout(() => initSharedSecret(attempt + 1), 250);
  }
}
initSharedSecret();
function authHeaders(extra) {
  const headers = Object.assign({}, extra || {});
  if (sharedSecret) headers["Authorization"] = "Bearer " + sharedSecret;
  return headers;
}
const pcStatusEl = document.getElementById("pcStatus");
const pcStatusText = document.getElementById("pcStatusText");

async function pollStatus() {
  try {
    const res = await fetch(BASE + "/status", { signal: AbortSignal.timeout(2500) });
    const data = await res.json();
    pcStatusEl.classList.add("online");
    pcStatusText.textContent = "Jarvis online";
    if (data.speaking) setOrbState("speaking");
    else if (data.processing) setOrbState("thinking");
    else setOrbState("idle");
  } catch (err) {
    pcStatusEl.classList.remove("online");
    pcStatusText.textContent = "Engine offline";
    setOrbState("idle");
  }
}
pollStatus();
setInterval(pollStatus, 1500);

const sysStrip = document.getElementById("sysStrip");
async function pollStats() {
  try {
    const res = await fetch(BASE + "/stats", { signal: AbortSignal.timeout(3000) });
    const d = await res.json();
    const parts = [];
    if (d.cpu_percent != null) parts.push(`<span><b>CPU</b> ${d.cpu_percent}%</span>`);
    if (d.ram) parts.push(`<span><b>RAM</b> ${d.ram.percent}%</span>`);
    if (d.drives && d.drives[0]) parts.push(`<span><b>${d.drives[0].name || "C:"}</b> ${d.drives[0].percent}%</span>`);
    sysStrip.innerHTML = parts.join("");
  } catch (err) {
    // Leave whatever was last shown -- no need to blank it on one miss.
  }
}
pollStats();
setInterval(pollStats, 5000);

const activityPanel = document.getElementById("activityPanel");
async function pollActivity() {
  try {
    const res = await fetch(BASE + "/activity", { signal: AbortSignal.timeout(3000) });
    const d = await res.json();
    const current = d.current_action ? `<div class="current">${d.current_action}</div>` : "";
    const recent = (d.recent || []).slice(-2).map(a => `<div>${a.text || a}</div>`).join("");
    activityPanel.innerHTML = current + recent;
  } catch (err) {
    // Same as above -- fine to just leave the last known content.
  }
}
pollActivity();
setInterval(pollActivity, 4000);

// ============================================================
// Chat log -- populated regardless of which view (orb or window) is
// currently visible, so switching between them never loses history;
// it's a plain CSS visibility toggle over the same persistent DOM/state,
// nothing is rebuilt or reset.
// ============================================================
const chatLogEl = document.getElementById("chatLog");
function appendChatMessage(role, text, imageDataUrl) {
  const row = document.createElement("div");
  row.className = "chat-msg " + (role === "user" ? "chat-user" : "chat-jarvis");
  if (text) {
    const textEl = document.createElement("div");
    textEl.className = "chat-text";
    textEl.textContent = text;
    row.appendChild(textEl);
  }
  if (imageDataUrl) {
    const img = document.createElement("img");
    img.className = "chat-image";
    img.src = imageDataUrl;
    row.appendChild(img);
  }
  chatLogEl.appendChild(row);
  chatLogEl.scrollTop = chatLogEl.scrollHeight;
}

async function sendCommand(text) {
  if (!text.trim()) return;
  appendChatMessage("user", text);
  setOrbState("thinking");
  try {
    const res = await fetch(BASE + "/command", {
      method: "POST",
      headers: authHeaders({ "Content-Type": "application/json" }),
      body: JSON.stringify({ command: text }),
    });
    const data = await res.json();
    if (data.reply) appendChatMessage("jarvis", data.reply);
    else if (data.error) appendChatMessage("jarvis", data.error);
  } catch (err) {
    pcStatusText.textContent = "Couldn't reach Jarvis";
  }
}

const textInput = document.getElementById("textInput");
function submitText() {
  const text = textInput.value.trim();
  if (!text) return;
  textInput.value = "";
  sendCommand(text);
}
document.getElementById("sendBtn").addEventListener("click", submitText);
textInput.addEventListener("keydown", (e) => { if (e.key === "Enter") submitText(); });

document.getElementById("stopBtn").addEventListener("click", () => {
  fetch(BASE + "/stop", { method: "POST", headers: authHeaders() }).catch(() => {});
});

// ============================================================
// Attach a picture -- reads it locally as a data URL (nothing is
// uploaded anywhere except straight to the local engine) and asks the
// vision model about it, same mechanism as the existing screen-vision
// feature but for a picture the user chose instead of a screen capture.
// ============================================================
const fileInput = document.getElementById("fileInput");
document.getElementById("attachBtn").addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", async () => {
  const file = fileInput.files[0];
  if (!file) return;
  const dataUrl = await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
  const question = textInput.value.trim();
  textInput.value = "";
  appendChatMessage("user", question || null, dataUrl);
  setOrbState("thinking");
  try {
    const res = await fetch(BASE + "/attach_image", {
      method: "POST",
      headers: authHeaders({ "Content-Type": "application/json" }),
      body: JSON.stringify({ image: dataUrl, question }),
    });
    const data = await res.json();
    if (data.reply) appendChatMessage("jarvis", data.reply);
    else if (data.error) appendChatMessage("jarvis", data.error);
  } catch (err) {
    pcStatusText.textContent = "Couldn't reach Jarvis";
  }
  fileInput.value = "";
});

// ============================================================
// Generated images land here (see generate_image_from_prompt /
// GET /last_image on the PC) rather than through /command's reply text,
// since that channel only ever carries a plain string. Cursor-based
// (by id) so a page reload doesn't re-show an old image as if it were
// new.
// ============================================================
let lastSeenImageId = null;
async function pollLastImage() {
  try {
    const res = await fetch(BASE + "/last_image", { signal: AbortSignal.timeout(3000) });
    const data = await res.json();
    if (lastSeenImageId === null) {
      lastSeenImageId = data.id || 0;
      return;
    }
    if (data.id && data.id !== lastSeenImageId) {
      lastSeenImageId = data.id;
      appendChatMessage("jarvis", data.prompt ? `Generated: ${data.prompt}` : null, data.data_url);
    }
  } catch (err) {
    // Fine to just try again next tick.
  }
}
pollLastImage();
setInterval(pollLastImage, 3000);

// ============================================================
// Orb view <-> window view toggle. Purely a CSS class flip on <body> --
// the chat log, orb, and all JS state underneath are the same persistent
// elements either way, so switching back loses nothing.
// ============================================================
const modeToggleBtn = document.getElementById("modeToggleBtn");
let windowMode = false;
modeToggleBtn.addEventListener("click", () => {
  windowMode = !windowMode;
  document.body.classList.toggle("window-mode", windowMode);
  modeToggleBtn.title = windowMode ? "Switch to orb view" : "Switch to window view";
  modeToggleBtn.innerHTML = windowMode ? "&#9679;" : "&#9635;";
});
</script>
</body>
</html>

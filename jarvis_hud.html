<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Jarvis</title>
<style>
  :root{
    --cyan: #34e5ff;
    --blue: #2f8dff;
    --purple: #9b6bff;
    --text: #eafcff;
    --text-dim: rgba(220, 240, 255, 0.6);
  }
  html, body {
    margin:0; padding:0; width:100%; height:100%;
    background: transparent;
    color: var(--text);
    font-family: "Segoe UI", "Consolas", sans-serif;
    overflow:hidden;
    -webkit-user-select:none; user-select:none;
  }
  input { user-select: text; }

  .wrap {
    width:100%; height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:22px;
    -webkit-app-region: no-drag;
  }

  /* Whole orb area drags the window -- pywebview only honors the literal
     class "pywebview-drag-region", not the CSS -webkit-app-region property. */
  .drag-region { position:absolute; inset:0; pointer-events:none; }

  .winctrls {
    position:absolute; top:10px; right:14px; display:flex; gap:8px; z-index:5;
    opacity:0; transition: opacity 0.2s ease;
  }
  .wrap:hover .winctrls { opacity:0.7; }
  .winctrls:hover { opacity:1 !important; }
  .winbtn {
    width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    color: var(--text-dim); cursor:pointer; font-size:11px; background: rgba(10,20,35,0.55);
    border:1px solid rgba(120,200,255,0.25);
  }
  .winbtn:hover { background: rgba(52,229,255,0.25); color:#fff; }
  .winbtn.close:hover { background: rgba(255,90,90,0.4); color:#fff; }

  /* ---------- The orb ---------- */
  .orb-outer {
    position:relative; width:150px; height:150px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    z-index:2;
  }
  .orb-ring {
    position:absolute; inset:0; border-radius:50%;
    border:1.5px solid rgba(90,180,255,0.25);
    animation: spin 14s linear infinite;
  }
  .orb-ring.outer2 { inset:-16px; border-color: rgba(155,107,255,0.16); animation-duration: 22s; animation-direction: reverse; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .orb {
    width:104px; height:104px; border-radius:50%;
    background: radial-gradient(circle at 38% 32%, #ffffff, var(--cyan) 42%, var(--blue) 78%, #12345f 100%);
    box-shadow:
      0 0 30px 6px rgba(52,229,255,0.45),
      0 0 70px 18px rgba(52,229,255,0.15);
    transition: transform 0.18s ease, box-shadow 0.18s ease;
    animation: breathe 3.6s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.035); }
  }

  /* Thinking: quicker, tighter pulse in purple. */
  .orb-outer.processing .orb {
    animation: think 1.1s ease-in-out infinite;
    background: radial-gradient(circle at 38% 32%, #ffffff, #c9a8ff 42%, var(--purple) 78%, #2a1a55 100%);
    box-shadow: 0 0 30px 6px rgba(155,107,255,0.5), 0 0 70px 18px rgba(155,107,255,0.18);
  }
  @keyframes think {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }

  /* Speaking: livelier, irregular-feeling movement (three overlapping
     rhythms so it doesn't look like a metronome), brighter glow. */
  .orb-outer.speaking .orb {
    animation: speak-a 0.62s ease-in-out infinite, speak-glow 0.9s ease-in-out infinite;
  }
  @keyframes speak-a {
    0%   { transform: scale(1)    translateY(0); }
    30%  { transform: scale(1.09) translateY(-1px); }
    55%  { transform: scale(0.97) translateY(0.5px); }
    80%  { transform: scale(1.05) translateY(-0.5px); }
    100% { transform: scale(1)    translateY(0); }
  }
  @keyframes speak-glow {
    0%, 100% { box-shadow: 0 0 30px 6px rgba(52,229,255,0.5), 0 0 70px 18px rgba(52,229,255,0.18); }
    50%      { box-shadow: 0 0 42px 10px rgba(52,229,255,0.75), 0 0 90px 26px rgba(52,229,255,0.3); }
  }

  .status-text {
    font-size:12px; letter-spacing:0.5px; color: var(--text-dim);
    min-height:16px; text-align:center;
  }

  /* ---------- Input ---------- */
  .input-row {
    width:270px;
    display:flex; align-items:center; gap:0;
    background: rgba(8,16,28,0.55);
    border:1px solid rgba(120,200,255,0.22);
    border-radius:22px;
    padding: 4px 6px 4px 16px;
    backdrop-filter: blur(6px);
  }
  .input-row input {
    flex:1; background:transparent; border:none; outline:none;
    color: var(--text); font-size:13px; padding:8px 6px;
  }
  .input-row input::placeholder { color: rgba(220,240,255,0.4); }
  .send-btn {
    width:30px; height:30px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background: rgba(52,229,255,0.18); border:1px solid rgba(120,200,255,0.3);
    color: var(--cyan); cursor:pointer; font-size:13px;
  }
  .send-btn:hover { background: rgba(52,229,255,0.32); }

  .toast {
    position:absolute; bottom:18px; left:50%; transform:translateX(-50%) translateY(6px);
    background: rgba(10,18,30,0.85); border:1px solid rgba(120,200,255,0.3); border-radius:10px;
    padding:7px 14px; font-size:11.5px; color:var(--text); opacity:0; pointer-events:none;
    transition: all 0.25s ease; white-space:nowrap;
  }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="wrap">
  <div class="drag-region pywebview-drag-region"></div>

  <div class="winctrls">
    <div class="winbtn" id="hideBtn" title="Minimize to tray">&#8211;</div>
    <div class="winbtn close" id="closeBtn" title="Quit Jarvis">&#215;</div>
  </div>

  <div class="orb-outer" id="orbOuter">
    <div class="orb-ring"></div>
    <div class="orb-ring outer2"></div>
    <div class="orb"></div>
  </div>
  <div class="status-text" id="statusText">Standing by</div>

  <div class="input-row">
    <input id="cmdInput" type="text" placeholder="Speak, or type to Jarvis..." />
    <div class="send-btn" id="sendBtn" title="Send">&#10148;</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = "http://localhost:8765";

let toastTimer = null;
function showToast(text) {
  const el = document.getElementById("toast");
  el.textContent = text;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2400);
}

async function sendCommand(command) {
  if (!command) return;
  try {
    const res = await fetch(API + "/command", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ command }),
    });
    const data = await res.json();
    return data.reply || data.error || "";
  } catch (err) {
    showToast("Could not reach Jarvis.");
    return "";
  }
}

function submitInput() {
  const input = document.getElementById("cmdInput");
  const command = input.value.trim();
  if (!command) return;
  input.value = "";
  sendCommand(command);
}

document.getElementById("sendBtn").addEventListener("click", submitInput);
document.getElementById("cmdInput").addEventListener("keydown", (e) => { if (e.key === "Enter") submitInput(); });
document.getElementById("orbOuter").addEventListener("click", () => {
  showToast("Voice already listens automatically -- just say \"Jarvis\" or \"Jay\".");
});

// ---- Window chrome ----
function bindWindowChrome() {
  document.getElementById("hideBtn").addEventListener("click", () => window.pywebview && window.pywebview.api.hide_to_tray());
  document.getElementById("closeBtn").addEventListener("click", () => window.pywebview && window.pywebview.api.quit_app());
}
if (window.pywebview) bindWindowChrome();
else window.addEventListener("pywebviewready", bindWindowChrome);

// ---- Poll /status -> drive the orb's state (idle / thinking / speaking) ----
const orbOuter = document.getElementById("orbOuter");
const statusText = document.getElementById("statusText");

async function pollStatus() {
  try {
    const res = await fetch(API + "/status", { cache: "no-store" });
    const s = await res.json();
    orbOuter.classList.toggle("speaking", !!s.speaking);
    orbOuter.classList.toggle("processing", !s.speaking && !!s.processing);
    statusText.textContent = s.speaking ? "Speaking..." : (s.processing ? "Working on it..." : "Standing by");
  } catch (err) {
    orbOuter.classList.remove("speaking", "processing");
    statusText.textContent = "Offline";
  }
}
pollStatus();
setInterval(pollStatus, 400);
</script>
</body>
</html>
